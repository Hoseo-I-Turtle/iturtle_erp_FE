# 빌드는 여기서, 배포는 연구실 젠킨스(Jenkinsfile)가 한다 — 젠킨스 호스트에는 볼트가 열려 있어 npm 패키지 코드를 거기서 돌리지 않는다.
# PR: 린트 · 빌드 확인. main: 빌드한 정적 파일을 이미지(ghcr.io/hoseo-i-turtle/iturtle_erp_fe)로 올린다 — 젠킨스가 커밋 SHA 태그를 기다렸다가 배포.
name: ci-cd

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**
      - "**/*.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: github.event_name == 'push'
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hoseo-i-turtle/iturtle_erp_fe:${{ github.sha }}
            ghcr.io/hoseo-i-turtle/iturtle_erp_fe:main
            ghcr.io/hoseo-i-turtle/iturtle_erp_fe:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
